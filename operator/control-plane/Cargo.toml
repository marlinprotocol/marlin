[package]
name = "control-plane"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[lib]
name = "cp"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.95"
aws-config = { version = "1.5.12", features = ["behavior-version-latest"] }
aws-sdk-ec2 = "1.117.0"
aws-types = "1.3.3"
axum = "0.8.1"
base64 = "0.22.1"
clap = { version = "4.5.23", features = ["derive"] }
diesel = { version = "2.3.7", features = ["serde_json"] }
indexer-framework = { version = "0.1.0", path = "../indexer-framework" }
rand_core = { version = "0.6.4", features = ["getrandom"] }
regex = "1.12.2"
reqwest = { version = "0.12.12", features = ["rustls-tls"], default-features = false }
serde = "1.0.217"
serde_json = "1.0.134"
ssh-key = { version = "0.6.7", features = ["ed25519"] }
tokio = { version = "1.42.0", features = ["full", "test-util"] }
tokio-retry = "0.3.0"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
whoami = "1.5.2"

[dev-dependencies]
hex = "0.4.3"
httpc-test = "0.1.10"

[profile.release]
lto = true
panic = "abort"
codegen-units = 1
