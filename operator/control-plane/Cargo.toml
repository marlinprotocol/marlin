[package]
name = "control-plane"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[lib]
name = "cp"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.102"
aws-config = { version = "1.8.15", features = ["behavior-version-latest"] }
aws-sdk-ec2 = "1.220.1"
aws-types = "1.3.14"
axum = "0.8.8"
base64 = "0.22.1"
clap = { version = "4.6.0", features = ["derive"] }
diesel = { version = "2.3.7", features = ["serde_json"] }
indexer-framework = { version = "0.1.0", path = "../indexer-framework" }
rand_core = { version = "0.10.0", features = ["getrandom"] }
regex = "1.12.3"
reqwest = { version = "0.13.2", features = ["rustls-tls"], default-features = false }
serde = "1.0.228"
serde_json = "1.0.149"
ssh-key = { version = "0.6.7", features = ["ed25519"] }
tokio = { version = "1.51.0", features = ["full", "test-util"] }
tokio-retry = "0.3.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
whoami = "2.1.1"

[dev-dependencies]
hex = "0.4.3"
httpc-test = "0.1.10"

[profile.release]
lto = true
panic = "abort"
codegen-units = 1
