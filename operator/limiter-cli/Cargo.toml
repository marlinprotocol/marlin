[package]
name = "limiter-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
aya = "0.13"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
log = "0.4"
env_logger = "0.10"
