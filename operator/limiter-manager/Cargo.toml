[package]
name = "limiter-manager"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.8", features = ["macros"] }
clap = { version = "4.5.55", features = ["derive"] }
futures = "0.3.31"
log = "0.4.26"
env_logger = "0.11.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["full"] }
