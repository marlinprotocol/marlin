[package]
name = "marlin-cvm"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy = {version = "2.0.0", features = ["full"]}
anyhow = "1.0.102"
async-trait = "0.1.89"
base64 = "0.22.1"
bcs = "0.2.0"
bech32 = "0.11.1"
chrono = "0.4.44"
clap = { version = "4.6.0", features = ["derive"] }
futures-util = "0.3"
hex = "0.4.3"
k256 = "0.13.4"
lazy_static = "1.5.0"
libsodium-sys-stable = "1.24.0"
openssl = { version = "0.10", features = ["vendored"] }
oyster-sdk = "0.17.1"
prettytable-rs = "0.10"
reqwest = { version = "0.13.2", features = ["multipart", "json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sui-crypto = { git = "https://github.com/mystenlabs/sui-rust-sdk", package = "sui-crypto", features = ["ed25519", "secp256r1", "secp256k1"]}
sui-rpc = { git = "https://github.com/mystenlabs/sui-rust-sdk", package = "sui-rpc"}
sui-sdk-types = { git = "https://github.com/mystenlabs/sui-rust-sdk", package = "sui-sdk-types"}
tokio = { version = "1.51", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"]}
ureq = "3.3.0"
